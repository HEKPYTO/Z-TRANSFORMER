name: CI

on:
  push:
  pull_request:
  # The mutation job below is gated on `workflow_dispatch`, so without this
  # trigger the manual path is unreachable and the gate names an event that can
  # never fire. Found by reading the condition against the trigger list, which
  # is the same shape of mistake as a `pull_request` nested under `push`.
  workflow_dispatch:
  schedule:
    # Weekly, deliberately off the hour: GitHub's scheduler is least reliable at
    # the top of the hour and a dropped run is a check that silently stopped
    # running. The mutation job below keys on this event.
    - cron: "37 5 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # `zig build verify` includes the peak-memory gate, which reads
      # `ru_maxrss` through GNU time on Linux. Without this the gate fails
      # rather than skips, because a gate that cannot run is a claim, and a
      # green CI run that checked nothing is exactly the thing to avoid.
      - name: install GNU time
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends time
      # The only property the step graph cannot assert about itself, and it is
      # asserted on the SAME run that gates. `verify` runs a full 123-step
      # training pass and both test binaries, and this used to invoke it twice --
      # once bare to fail the build, then again to capture the output -- so
      # every CI run paid for the whole gate twice to check something the first
      # run's own transcript already showed. One invocation gates and captures.
      - name: verify passes and is silent
        run: |
          set -e
          log=$(mktemp)
          zig build verify >"$log" 2>&1 || { cat "$log"; exit 1; }
          test ! -s "$log" || { echo "::error::zig build verify wrote $(wc -c <"$log") bytes on a passing run"; cat "$log"; exit 1; }

  # The parity check is this repository's central claim and `verify` cannot
  # reach it: the oracle is Python, and AGENTS.md forbids Python in the build
  # graph. It is its own job because a headline claim checked only on one
  # person's laptop is not a checked claim.
  #
  # The pins in tools/removed/requirements.txt are load-bearing: reference-library v5
  # moved rope_theta into rope_parameters, so an unpinned install silently
  # compares against theta=10000 and fails on RoPE while looking like a
  # numerics bug. The oracle asserts the resolved theta independently.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv venv-removed
      - run: venv-removed/bin/pip install -r tools/removed/requirements.txt
      - run: sh tools/removed/check.sh
      # That the gates CAN fail is a different claim from that they pass, and it
      # is the one that makes report.csv mean anything. A silent gate exits 0
      # here, so a red run is a harness that has stopped checking.
      - name: the parity gates can fail
        run: sh tools/removed/sensitivity.sh

  # That the test suite can still FAIL is a different claim from that it passes,
  # and it is the one nothing above checks. The mutation suite breaks the code on
  # purpose, 18 ways, and requires the suite to notice; it is what caught the
  # `gradcheck` tolerance being tuned rather than derived, and it is the only
  # instrument here that notices a test quietly ceasing to test anything.
  #
  # Scheduled rather than on every push, because eight minutes on every
  # keystroke is how a check gets skipped. `tools/README.md`
  # quotes "16 of 18 caught", and before this job existed nothing re-derived
  # that number: a test weakened anywhere in the tree would have moved it and no
  # run would have said so.
  mutation:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: sh tools/mutation/run.sh
