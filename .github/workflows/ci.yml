name: CI

on:
  push:
  pull_request:
  # The mutation job below is gated on `workflow_dispatch`, so without this
  # trigger the manual path is unreachable and the gate names an event that can
  # never fire. Found by reading the condition against the trigger list, which
  # is the same shape of mistake as a `pull_request` nested under `push`.
  workflow_dispatch:
  schedule:
    # Weekly, deliberately off the hour: GitHub's scheduler is least reliable at
    # the top of the hour and a dropped run is a check that silently stopped
    # running. The mutation job below keys on this event.
    - cron: "37 5 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # `zig build verify` includes the peak-memory gate, which reads
      # `ru_maxrss` through GNU time on Linux. Without this the gate fails
      # rather than skips, because a gate that cannot run is a claim, and a
      # green CI run that checked nothing is exactly the thing to avoid.
      - name: install GNU time
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends time
      # The only property the step graph cannot assert about itself, and it is
      # asserted on the SAME run that gates. `verify` runs a full 123-step
      # training pass and both test binaries, and this used to invoke it twice --
      # once bare to fail the build, then again to capture the output -- so
      # every CI run paid for the whole gate twice to check something the first
      # run's own transcript already showed. One invocation gates and captures.
      - name: verify passes and is silent
        run: |
          set -e
          log=$(mktemp)
          zig build verify >"$log" 2>&1 || { cat "$log"; exit 1; }
          test ! -s "$log" || { echo "::error::zig build verify wrote $(wc -c <"$log") bytes on a passing run"; cat "$log"; exit 1; }


  # That the test suite can still FAIL is a different claim from that it passes,
  # and it is the one nothing above checks. The mutation suite breaks the code on
  # purpose, 18 ways, and requires the suite to notice; it is what caught the
  # `gradcheck` tolerance being tuned rather than derived, and it is the only
  # instrument here that notices a test quietly ceasing to test anything.
  #
  # Scheduled rather than on every push, because eight minutes on every
  # keystroke is how a check gets skipped. Before this job existed nothing re-derived
  # the caught count: a test weakened anywhere in the tree would have moved it and no
  # run would have said so.
  #
  # The floor below is MEASURED, 15 of 18 at 6272360, and `tools/README.md` carries
  # the same number with the three survivors classified. The 16 an earlier version of
  # that document quoted is gone: three patterns had gone stale, and the harness's
  # own classifier was scoring caught mutants as errors, so the number it reported was
  # zero for a while and is now the measurement rather than a memory.
  mutation:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # `run.sh` takes an optional MUTATION_EXPECTED_CAUGHT floor, which is what makes
      # this step able to go red: `run.sh` exits 0 on a SURVIVOR by design, because a
      # survivor is a measurement rather than an error, so running it bare would let the
      # caught count fall as far as zero with the job still green. Below the floor it
      # names the mutants that got through and exits 1.
      #
      # 15 is MEASURED on this platform family, not quoted: `sh tools/mutation/run.sh`
      # reports `caught 15 of 18` on Linux, and the same fifteen on the development
      # machine. The three survivors are all equivalent mutations or below the gates, so
      # 15 is the strongest claim suite strength supports -- the suite catches every
      # mutant a test can distinguish, and a drop below 15 means one of those tests
      # stopped holding.
      #
      # The floor was 16 before, from a figure this repository quoted rather than
      # measured, and it was reached through three separate repairs worth recording
      # because each is a way this gate can lie. Three of `mutate.zig`'s patterns had
      # gone stale after `src/tensor.zig` was rewritten. The reason a sweep then reported
      # `caught 0 of 18` was the CLASSIFIER, not the mutants: its `caught` pattern
      # required `pass` and `fail` to be adjacent in Zig's summary line, and a skip count
      # between them (two tests sit behind `comptime model.cuda_attn`) sent every
      # genuinely-caught mutation to the `error` branch. And a measurement of 13 taken on
      # this host was discarded rather than adopted, because `run.sh` builds its worktree
      # from git HEAD and HEAD was behind, so that number described old source.
      #
      # That last one is why this number is not 13: a floor set from a measurement of
      # the wrong commit is worse than no floor, because it is a gate that looks
      # deliberate. `tools/README.md` carries the same 15 and classifies the survivors.
      - run: sh tools/mutation/run.sh
        env:
          MUTATION_EXPECTED_CAUGHT: '15'
