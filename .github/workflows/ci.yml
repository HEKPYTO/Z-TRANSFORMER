name: CI

on:
  push:
  pull_request:
  # The mutation job below is gated on `workflow_dispatch`, so without this
  # trigger the manual path is unreachable and the gate names an event that can
  # never fire. Found by reading the condition against the trigger list, which
  # is the same shape of mistake as a `pull_request` nested under `push`.
  workflow_dispatch:
  schedule:
    # Weekly, deliberately off the hour: GitHub's scheduler is least reliable at
    # the top of the hour and a dropped run is a check that silently stopped
    # running. The mutation job below keys on this event.
    - cron: "37 5 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # `zig build verify` includes the peak-memory gate, which reads
      # `ru_maxrss` through GNU time on Linux. Without this the gate fails
      # rather than skips, because a gate that cannot run is a claim, and a
      # green CI run that checked nothing is exactly the thing to avoid.
      - name: install GNU time
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends time
      # The only property the step graph cannot assert about itself, and it is
      # asserted on the SAME run that gates. `verify` runs a full 123-step
      # training pass and both test binaries, and this used to invoke it twice --
      # once bare to fail the build, then again to capture the output -- so
      # every CI run paid for the whole gate twice to check something the first
      # run's own transcript already showed. One invocation gates and captures.
      - name: verify passes and is silent
        run: |
          set -e
          log=$(mktemp)
          zig build verify >"$log" 2>&1 || { cat "$log"; exit 1; }
          test ! -s "$log" || { echo "::error::zig build verify wrote $(wc -c <"$log") bytes on a passing run"; cat "$log"; exit 1; }

  # The parity check is this repository's central claim and `verify` cannot
  # reach it: the oracle is Python, and AGENTS.md forbids Python in the build
  # graph. It is its own job because a headline claim checked only on one
  # person's laptop is not a checked claim.
  #
  # The pins in tools/removed/requirements.txt are load-bearing: reference-library v5
  # moved rope_theta into rope_parameters, so an unpinned install silently
  # compares against theta=10000 and fails on RoPE while looking like a
  # numerics bug. The oracle asserts the resolved theta independently.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv venv-removed
      - run: venv-removed/bin/pip install -r tools/removed/requirements.txt
      - run: sh tools/removed/check.sh
      # That the gates CAN fail is a different claim from that they pass, and it
      # is the one that makes report.csv mean anything. A silent gate exits 0
      # here, so a red run is a harness that has stopped checking.
      - name: the parity gates can fail
        run: sh tools/removed/sensitivity.sh

  # That the test suite can still FAIL is a different claim from that it passes,
  # and it is the one nothing above checks. The mutation suite breaks the code on
  # purpose, 18 ways, and requires the suite to notice; it is what caught the
  # `gradcheck` tolerance being tuned rather than derived, and it is the only
  # instrument here that notices a test quietly ceasing to test anything.
  #
  # Scheduled rather than on every push, because eight minutes on every
  # keystroke is how a check gets skipped. Before this job existed nothing re-derived
  # the caught count: a test weakened anywhere in the tree would have moved it and no
  # run would have said so.
  #
  # The floor below is MEASURED, 15 of 18 at 6272360, and `tools/README.md` carries
  # the same number with the three survivors classified. The 16 an earlier version of
  # that document quoted is gone: three patterns had gone stale, and the harness's
  # own classifier was scoring caught mutants as errors, so the number it reported was
  # zero for a while and is now the measurement rather than a memory.
  mutation:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # `run.sh` takes an optional MUTATION_EXPECTED_CAUGHT floor, which makes this
      # step able to go red when the caught count drops: it names the mutants that got
      # through and exits 1. It is deliberately NOT set here, and the reason is worth
      # stating because an earlier version of this file did set it.
      #
      # The knob was pinned to 16, from the figure `tools/README.md` quotes. That
      # number was never measured ON THIS RUNNER, and `caught` is not a clean measure
      # of suite strength in the first place: `unbuildable` and the gate's own ERROR
      # branch both raise `broken` without raising `caught`, so a mutation whose
      # pattern goes stale looks identical to a survivor from the floor's side. One
      # such stale pattern was observed this session. Pinning an unmeasured count on a
      # job that runs weekly would make it permanently red for a reason unrelated to
      # the code -- the same failure mode this repository already documents for
      # keeping `cuda-check` out of `verify`.
      #
      # So the floor stays available and unset. Whoever next runs this on the target
      # runner should read the count it prints, set the constant to it, and commit
      # that -- the measurement, not this file's guess, is what the gate needs.
      # The floor, measured rather than quoted, and measured on THIS platform family:
      # `sh tools/mutation/run.sh` reports `caught 15 of 18` on Linux at f79a59a and
      # the same fifteen on the development machine at 6272360. The three survivors are
      # all equivalent or below the gates, so 15 is the strongest claim suite strength
      # supports -- the suite catches every mutant a test can distinguish, and a drop
      # below 15 means one of those tests stopped holding.
      #
      # It was `continue-on-error` until the harness was repaired, and an earlier
      # measurement of 13 on this host was discarded rather than adopted: `run.sh`
      # builds its worktree from git HEAD, and this host's HEAD was behind, so that
      # number described old source. A floor set from a measurement of the wrong commit
      # is worse than no floor, because it is a gate that looks deliberate.
      #
      # This was `continue-on-error` until the harness was repaired, and the repair was
      # not what it looked like: three of `mutate.zig`'s patterns had gone stale after
      # `src/tensor.zig` was rewritten, but the reason a sweep reported `caught 0 of 18`
      # was the CLASSIFIER -- its `caught` pattern required `pass` and `fail` to be
      # adjacent in Zig's summary line, and a skip count between them (two tests are
      # gated behind `comptime model.cuda_attn`) sent every genuinely-caught mutation
      # to the `error` branch. See `tools/README.md` for both.
      - run: sh tools/mutation/run.sh
        env:
          MUTATION_EXPECTED_CAUGHT: '15'
