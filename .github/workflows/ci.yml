name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig fmt --check .
      - run: zig build test
      - run: zig build run
      - name: a passing test run is silent
        run: |
          set -e
          log=$(mktemp)
          zig build test >"$log" 2>&1 || { cat "$log"; exit 1; }
          test ! -s "$log" || { echo "::error::zig build test wrote $(wc -c <"$log") bytes on a passing run"; cat "$log"; exit 1; }
