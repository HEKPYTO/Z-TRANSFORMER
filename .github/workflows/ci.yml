name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build verify
      # The only property the step graph cannot assert about itself. The test
      # runs inside `verify` are part of its output, so a silent `verify` is a
      # silent test run.
      - name: a passing verify run is silent
        run: |
          set -e
          log=$(mktemp)
          zig build verify >"$log" 2>&1 || { cat "$log"; exit 1; }
          test ! -s "$log" || { echo "::error::zig build verify wrote $(wc -c <"$log") bytes on a passing run"; cat "$log"; exit 1; }
